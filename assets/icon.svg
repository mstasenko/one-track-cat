<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">OneTrackCat</title>
  <desc id="description">A black cat curled around a video play symbol on a purple rounded square.</desc>
  <defs>
