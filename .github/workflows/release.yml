name: Release
run-name: "Release: publish — ${{ github.ref_name }}"

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.1
          package-manager-cache: false

      - name: Install GNOME Wayland runtime and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-shell pulseaudio libgbm1 libgtk-3-0 libnss3 libasound2t64 cmake g++ p7zip-full zip unzip zlib1g libzstd1 ninja-build patchelf pkg-config ocl-icd-opencl-dev
          npm install --global npm@11.18.0

      - name: Set up voice runtime Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.6

      - name: Verify release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          fi
          npm run verify:ci

      - name: Build and verify the optional voice pack
        run: |
          python scripts/prepare-voice-pack.py
          npm run build:voice-pack

      - name: Set up build-only Python for the native AI pack recipe
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.11.15

      - name: Build release files
        run: |
          npm run package
          npm run build:face-pack
          otc_CPU_ONLY=1 npm run verify:face-pack
          # Bound the source compiler and its children; keep artifacts runner-owned.
          sudo systemd-run --wait --pipe --collect \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD" \
            --property=MemoryMax=6G --property=MemorySwapMax=0 \
            --setenv=PATH="$PATH" npm run build:upscale-pack
          otc_CPU_ONLY=1 npm run verify:upscale-pack
          # Exercise tiny native RIFE streams and FFmpeg/audio/cache composition.
          npm run test:packs

      - name: Check release assets
        run: |
          test -s release/otc-media-pack.zip
          test -s release/otc-face-pack.zip
          test -s release/otc-upscale-pack.zip
          test -s release/otc-voice-pack.zip
          cd release
          sha256sum ./*.AppImage ./*.zip > SHA256SUMS

      - name: Smoke-test packaged AppImage on Wayland
        run: |
          appimage="release/OneTrackCat-$(node -p 'require("./package.json").version')-ubuntu26-wayland-x86_64.AppImage"
          test -f "$appimage"
          node scripts/run-headless-wayland.mjs node scripts/smoke-appimage.mjs

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            coverage/
            playwright-report/
            test-results/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.AppImage release/*.zip release/SHA256SUMS --clobber
          else
            git log -1 --format=%b | sed '/^Validation:/,$d' > "$RUNNER_TEMP/release-notes.md"
            gh release create "$GITHUB_REF_NAME" release/*.AppImage release/*.zip release/SHA256SUMS --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
